apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: taskflow
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: ajayapst/taskflow-frontend:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80